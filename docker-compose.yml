services:
  broker:
    image: apache/kafka:latest
    container_name: broker
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1  # Single node, acts as both controller and broker 
      KAFKA_PROCESS_ROLES: broker, controller

      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092, CONTROLLER://localhost:9093 # each role needs a listener port, 
                # but Kafka clients never connect here, the controller is internal
                # 0.0.0.0 means accept from any interface 
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092 
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT

      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1   # Single-replica topics for simplicity (for now)
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 1   # Default number of partitions in a topic
      KAFKA_DELETE_TOPIC_ENABLE: true

    volumes: # so that the data on the topics isnt lost in between each run
      - kafka_data:/var/lib/kafka/data


volumes:
  kafka_data: {}